<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SaaS Clínicas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background-color: #007bff; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #errorMsg { color: red; text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" required placeholder="correo@clinica.com">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required placeholder="••••••••">

            <button type="submit">Ingresar</button>
        </form>
        <div id="errorMsg"></div>
    </div>

    <!-- SDK de Firebase para el navegador -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Configuración de tu proyecto Firebase (puedes ajustarla con tus credenciales web de Firebase)
        const firebaseConfig = {
            apiKey: "TU_API_KEY_DE_FIREBASE",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                // Iniciar sesión con Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const token = await userCredential.user.getIdToken();

                // Guardar el token en el almacenamiento local del navegador
                localStorage.setItem('authToken', token);

                alert('¡Inicio de sesión exitoso!');
                // Redirigir al panel médico o principal
                window.location.href = 'dashboard-medico.html';

            } catch (error) {
                errorMsg.innerText = 'Error al iniciar sesión: ' + error.message;
            }
        });
    </script>
</body>
</html>
